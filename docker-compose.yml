services:
  db:
    image: postgis/postgis:16-3.4
    container_name: saarthi_postgis
    environment:
      POSTGRES_USER: saarthi
      POSTGRES_PASSWORD: saarthi_pass
      POSTGRES_DB: saarthi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saarthi_backend
    environment:
      - DATABASE_URL=postgresql://saarthi:saarthi_pass@db:5432/saarthi_db
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saarthi_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  pgdata:
